name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang clang-format pkg-config \
            libgtest-dev libsqlite3-dev \
            protobuf-compiler protobuf-compiler-grpc \
            libprotobuf-dev libgrpc++-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DDOS_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Format check
        run: |
          files=$(find src include tests tools -name '*.cc' -o -name '*.h')
          clang-format --dry-run --Werror $files

  thread-sanitizer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang pkg-config \
            libgtest-dev libsqlite3-dev \
            protobuf-compiler protobuf-compiler-grpc \
            libprotobuf-dev libgrpc++-dev

      - name: Configure (TSan)
        run: cmake -S . -B build-tsan -G Ninja -DDOS_SANITIZER=thread
        env:
          CC: clang
          CXX: clang++

      - name: Build (TSan)
        run: cmake --build build-tsan

      # Exclude the gRPC-backed integration tests: the distro gRPC/abseil shared
      # libraries are not TSan-instrumented, so TSan reports false positives from
      # gRPC's own threads. Our concurrency code (thread pool, sharded object
      # store, coordinator) is fully covered by the unit-test ConcurrencyTest
      # suite, which does run here.
      - name: Test (TSan, excluding gRPC integration tests)
        run: ctest --test-dir build-tsan --output-on-failure -E 'ReplicationTest|MetadataSplitTest'
        env:
          TSAN_OPTIONS: halt_on_error=1
