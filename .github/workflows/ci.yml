name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang clang-format \
            libgtest-dev libsqlite3-dev

      - name: Configure
        run: cmake -S . -B build -G Ninja -DDOS_WERROR=ON

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Format check
        run: |
          files=$(find src include tests tools -name '*.cc' -o -name '*.h')
          clang-format --dry-run --Werror $files
