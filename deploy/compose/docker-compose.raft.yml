# Raft-replicated control plane (spec Milestone 15):
#   docker compose -f deploy/compose/docker-compose.raft.yml up --build
#
# Same cluster as docker-compose.yml, but the metadata control plane runs as a
# THREE-node Raft group (metadata-a/b/c) instead of a single process. Each has a
# durable volume for its Raft log, so no committed metadata is lost across a
# leader failure or restart. The gateway targets metadata-a; a write that lands
# on a follower is transparently forwarded to the leader.
#
# Try it: `docker compose ... stop metadata-a` (if it's the leader) and watch a
# survivor take over in the logs (msg=raft_leader_elected); writes keep working.
name: dos-raft

x-node-image: &image
  build:
    context: ../..
    dockerfile: deploy/docker/Dockerfile
  image: dos:latest

x-node-health: &grpc-health
  interval: 5s
  timeout: 3s
  retries: 5

services:
  node-a:
    <<: *image
    command: ["dos_node", "--id", "node-a", "--address", "0.0.0.0:9001", "--data-dir", "/data"]
    volumes: ["node-a-data:/data"]
    healthcheck:
      <<: *grpc-health
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9001' || exit 1"]

  node-b:
    <<: *image
    command: ["dos_node", "--id", "node-b", "--address", "0.0.0.0:9001", "--data-dir", "/data"]
    volumes: ["node-b-data:/data"]
    healthcheck:
      <<: *grpc-health
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9001' || exit 1"]

  node-c:
    <<: *image
    command: ["dos_node", "--id", "node-c", "--address", "0.0.0.0:9001", "--data-dir", "/data"]
    volumes: ["node-c-data:/data"]
    healthcheck:
      <<: *grpc-health
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9001' || exit 1"]

  metadata-a:
    <<: *image
    command:
      - "dos_metadata"
      - "--id"
      - "A"
      - "--address"
      - "0.0.0.0:9000"
      - "--raft-address"
      - "0.0.0.0:9100"
      - "--raft-dir"
      - "/raft"
      - "--raft-peer"
      - "B=metadata-b:9100"
      - "--raft-peer"
      - "C=metadata-c:9100"
      - "--peer-meta"
      - "B=metadata-b:9000"
      - "--peer-meta"
      - "C=metadata-c:9000"
      - "--node"
      - "node-a=node-a:9001"
      - "--node"
      - "node-b=node-b:9001"
      - "--node"
      - "node-c=node-c:9001"
    volumes: ["raft-a:/raft"]
    depends_on:
      node-a: { condition: service_healthy }
      node-b: { condition: service_healthy }
      node-c: { condition: service_healthy }
    healthcheck:
      <<: *grpc-health
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]

  metadata-b:
    <<: *image
    command:
      - "dos_metadata"
      - "--id"
      - "B"
      - "--address"
      - "0.0.0.0:9000"
      - "--raft-address"
      - "0.0.0.0:9100"
      - "--raft-dir"
      - "/raft"
      - "--raft-peer"
      - "A=metadata-a:9100"
      - "--raft-peer"
      - "C=metadata-c:9100"
      - "--peer-meta"
      - "A=metadata-a:9000"
      - "--peer-meta"
      - "C=metadata-c:9000"
      - "--node"
      - "node-a=node-a:9001"
      - "--node"
      - "node-b=node-b:9001"
      - "--node"
      - "node-c=node-c:9001"
    volumes: ["raft-b:/raft"]
    depends_on:
      node-a: { condition: service_healthy }
      node-b: { condition: service_healthy }
      node-c: { condition: service_healthy }
    healthcheck:
      <<: *grpc-health
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]

  metadata-c:
    <<: *image
    command:
      - "dos_metadata"
      - "--id"
      - "C"
      - "--address"
      - "0.0.0.0:9000"
      - "--raft-address"
      - "0.0.0.0:9100"
      - "--raft-dir"
      - "/raft"
      - "--raft-peer"
      - "A=metadata-a:9100"
      - "--raft-peer"
      - "B=metadata-b:9100"
      - "--peer-meta"
      - "A=metadata-a:9000"
      - "--peer-meta"
      - "B=metadata-b:9000"
      - "--node"
      - "node-a=node-a:9001"
      - "--node"
      - "node-b=node-b:9001"
      - "--node"
      - "node-c=node-c:9001"
    volumes: ["raft-c:/raft"]
    depends_on:
      node-a: { condition: service_healthy }
      node-b: { condition: service_healthy }
      node-c: { condition: service_healthy }
    healthcheck:
      <<: *grpc-health
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9000' || exit 1"]

  gateway:
    <<: *image
    command: ["dos_gateway", "--address", "0.0.0.0:8080", "--metadata", "metadata-a:9000"]
    depends_on:
      metadata-a: { condition: service_healthy }
      metadata-b: { condition: service_healthy }
      metadata-c: { condition: service_healthy }
    ports: ["8080:8080"]
    healthcheck:
      <<: *grpc-health
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/metrics >/dev/null || exit 1"]

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ../prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
    depends_on: [gateway]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../grafana/provisioning:/etc/grafana/provisioning:ro
      - ../grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  node-a-data:
  node-b-data:
  node-c-data:
  raft-a:
  raft-b:
  raft-c:
