syntax = "proto3";

package dos.rpc;

import "storage.proto";  // reuse the Code enum

// Control-plane record: where an object's replicas live and its authoritative
// version/checksum. This never carries the object payload — only metadata.
message ObjectLocation {
  string key = 1;
  uint64 version = 2;
  string checksum = 3;  // sha256 hex
  uint64 size = 4;
  bool deleted = 5;
  repeated string replicas = 6;  // node ids currently holding this version
}

message NodeDesc {
  string id = 1;
  string address = 2;
}

// Metadata / control plane (spec Milestone 8). Owns cluster membership,
// consistent-hash placement, and the object -> replica-set map. Kept strictly
// separate from the data plane (StorageNode), which moves the bytes.
service Metadata {
  // Placement decision for a key (primary + distinct replicas), from the ring.
  rpc Placement(PlacementRequest) returns (PlacementResponse);
  // Record where an object version lives after a successful quorum write.
  rpc RegisterObject(ObjectLocation) returns (MetaAck);
  // Authoritative metadata for a key (no payload).
  rpc LookupObject(KeyRequest) returns (LookupResponse);
  // Tombstone the object in the control plane.
  rpc RemoveObject(KeyRequest) returns (MetaAck);
  // Enumerate object locations (for repair).
  rpc ListObjects(PrefixRequest) returns (ListObjectsResponse);
  // Membership admin.
  rpc AddNode(NodeDesc) returns (MetaAck);
  rpc ListNodes(NodesRequest) returns (ListNodesResponse);
}

message PlacementRequest {
  string key = 1;
  uint32 replication_factor = 2;
}
message PlacementResponse {
  Code code = 1;
  repeated string node_ids = 2;
}

message MetaAck {
  Code code = 1;
  string message = 2;
}

message KeyRequest { string key = 1; }
message LookupResponse {
  Code code = 1;
  string message = 2;
  ObjectLocation location = 3;
}

message PrefixRequest { string prefix = 1; }
message ListObjectsResponse {
  Code code = 1;
  repeated ObjectLocation objects = 2;
}

message NodesRequest {}
message ListNodesResponse {
  Code code = 1;
  repeated NodeDesc nodes = 2;
}
