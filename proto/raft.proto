syntax = "proto3";

package dos.rpc;

import "metadata.proto";  // ObjectLocation, NodeDesc for MetadataCommand

// Raft metadata coordination (spec Milestone 15). Runs the control plane on a
// replicated group of metadata nodes so a leader failure never loses committed
// metadata. Only *metadata* mutations flow through the log — never object bytes.

// One replicated log entry. `command` is opaque to the consensus layer: it is a
// serialized MetadataCommand that only the state machine (RaftMetadataRepository)
// decodes and applies. Keeping it opaque keeps Raft generic and testable.
message LogEntry {
  uint64 term = 1;
  uint64 index = 2;   // 1-based position in the log
  bytes command = 3;  // serialized MetadataCommand
}

// The deterministic state-machine command carried inside a committed LogEntry.
// Exactly the metadata mutations from the Metadata service (RegisterObject /
// RemoveObject / AddNode); reads never enter the log.
message MetadataCommand {
  oneof op {
    ObjectLocation register_object = 1;  // record where an object version lives
    string remove_object = 2;            // key to tombstone
    NodeDesc add_node = 3;               // membership addition
  }
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  // A pre-vote (Raft PhD thesis §9.6): a trial round the candidate runs at
  // term+1 WITHOUT incrementing its own term. A voter grants it only if it
  // would itself be willing to start an election (it has not heard from a
  // leader recently), so a partitioned/rejoining node cannot disrupt a healthy
  // leader by forcing a needless election.
  bool pre_vote = 5;
}
message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;   // index of entry immediately preceding `entries`
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;  // empty for a heartbeat
  uint64 leader_commit = 6;    // leader's commitIndex
}
message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // On failure, the follower's hint for where its log diverges, so the leader
  // can back up nextIndex quickly instead of one entry at a time.
  uint64 conflict_index = 3;
}

// Peer-to-peer consensus RPCs. Each metadata node runs one Raft server and is a
// client of every peer's.
service Raft {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
}
